<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>交易记录 · 盈亏分析</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="交易记录">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      overscroll-behavior: none;
      color: #e0e0e0;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 0 12px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .page {
      display: none;
      padding: 0;
      animation: fadeIn 0.2s ease;
    }
    .page.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 10px;
      overflow: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .card {
      background: #141414;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 0;
      border: 1px solid #222;
    }
    .card.compact {
      padding: 14px;
    }
    .card-title {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #252525;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .card.compact .card-title {
      margin-bottom: 12px;
      padding-bottom: 10px;
    }
    .card-row {
      display: flex;
      gap: 10px;
      margin-bottom: 0;
      flex-shrink: 0;
    }
    .card-row .card {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }
    .page.active > * {
      min-width: 0;
    }
    .btn-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group.compact {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #0a0a0a;
      color: #e0e0e0;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .form-group input.compact {
      padding: 12px 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #555;
    }
    .form-group input::placeholder {
      color: #555;
    }
    .form-group input:disabled {
      background: #1a1a1a;
      color: #666;
      cursor: not-allowed;
    }
    .hint-text {
      font-size: 0.75rem;
      color: #666;
      margin-top: 6px;
    }
    .pnl-input-group {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 10px;
    }
    .pnl-input-item {
      position: relative;
      min-width: 0;
    }
    .pnl-input-item label {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 6px;
    }
    .pnl-input-item.profit label {
      color: #4caf50;
    }
    .pnl-input-item.loss label {
      color: #f44336;
    }
    .pnl-input-item input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0a0a0a;
      color: #e0e0e0;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .pnl-input-item.profit input {
      border-color: #2a3a2a;
    }
    .pnl-input-item.profit input:focus {
      border-color: #4caf50;
    }
    .pnl-input-item.loss input {
      border-color: #3a2a2a;
      padding-left: 28px;
    }
    .pnl-input-item.loss input:focus {
      border-color: #f44336;
    }
    .loss-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #f44336;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s;
      min-height: 46px;
    }
    .btn.compact {
      padding: 12px;
      min-height: 44px;
      font-size: 0.9rem;
    }
    .btn-primary {
      background: #fff;
      color: #000;
    }
    .btn-primary:active:not(:disabled) {
      background: #ccc;
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #252525;
      color: #e0e0e0;
    }
    .btn-secondary:active {
      background: #333;
    }
    .btn-danger {
      background: #2a1a1a;
      color: #ff6b6b;
      border: 1px solid #3a2020;
    }
    .btn-danger:active {
      background: #3a2020;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .mode-switch {
      display: flex;
      background: #0a0a0a;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid #2a2a2a;
    }
    .mode-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: none;
      color: #666;
      cursor: pointer;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #333;
      color: #fff;
    }
    .current-balance {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid #252540;
    }
    .current-balance .label {
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .current-balance .value {
      color: #fff;
      font-size: 1.45rem;
      font-weight: 700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .stats-grid-small {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 6px;
    }
    .stat-card {
      min-width: 0;
    }
    .stat-card {
      background: #1a1a1a;
      padding: 10px 8px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #252525;
      transition: background 0.2s;
    }
    .stat-card.main {
      padding: 12px 10px;
    }
    /* 盈亏比卡片可点击样式 */
    .stat-card.clickable {
      cursor: pointer;
      user-select: none;
    }
    .stat-card.clickable:active {
      background: #2a2a2a;
      border-color: #444;
    }
    .stat-label {
      font-size: 0.6rem;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e0e0e0;
    }
    .stat-card.main .stat-value {
      font-size: 1rem;
    }
    .stat-value.positive { color: #4caf50; }
    .stat-value.negative { color: #f44336; }
    .chart-container {
      position: relative;
      flex: 1 1 auto;
      min-height: 130px;
      background: #0a0a0a;
      border-radius: 12px;
      margin-top: 10px;
    }
    #chartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none; /* 页面固定不滚动，手势全部交给图表处理 */
    }
    .chart-tabs-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #252525;
    }
    .chart-tabs {
      display: flex;
      gap: 6px;
    }
    .chart-tab {
      padding: 6px 12px;
      border: 1px solid #333;
      background: none;
      color: #666;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.75rem;
      transition: all 0.2s;
    }
    .chart-tab.active {
      background: #333;
      color: #fff;
      border-color: #444;
    }
    /* 固定视口：让交易数据页/交易记录页占满剩余空间 */
    #pageTrades .card.trades-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #pageTrades .card-title { flex-shrink: 0; }
    .trade-header { flex-shrink: 0; }
    #pageData .card.chart-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .chart-tabs-bar { flex-shrink: 0; }
    .chart-info { flex-shrink: 0; }
    .pnl-zoom { flex-shrink: 0; }
    /* 单笔盈亏信息区（参考样式：标题 + 日期 + 金额） */
    .chart-info {
      margin-top: 8px;
    }
    .chart-info .ci-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
    }
    .chart-info .ci-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-top: 2px;
    }
    .chart-info .ci-value.positive { color: #4caf50; }
    .chart-info .ci-value.negative { color: #f44336; }
    /* 统一：盈利绿、亏损红 */
    .chart-info .ci-value.profit { color: #4caf50; }
    .chart-info .ci-value.loss { color: #f44336; }

    .chart-tooltip {
      position: absolute;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      white-space: nowrap;
    }
    .chart-tooltip.show {
      opacity: 1;
    }
    .chart-tooltip .tt-label {
      color: #888;
      font-size: 0.7rem;
    }
    .chart-tooltip .tt-value {
      font-weight: 600;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    .chart-tooltip .tt-value.positive { color: #4caf50; }
    .chart-tooltip .tt-value.negative { color: #f44336; }
    .chart-tooltip .tt-value.profit { color: #f44336; }
    .chart-tooltip .tt-value.loss { color: #4caf50; }
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -18px;
      padding: 0 18px;
    }
    .trade-header {
      display: grid;
      grid-template-columns: 32px minmax(72px,1.2fr) 64px 74px 44px;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #252525;
      font-size: 0.75rem;
      color: #666;
      font-weight: 500;
    }
    .trade-header span {
      text-align: center;
    }
    .trade-header span:nth-child(2),
    .trade-header span:nth-child(5) {
      text-align: left;
    }
    .trade-header span:last-child {
      text-align: center;
    }
    .trade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .trade-item {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 14px;
      display: grid;
      grid-template-columns: 32px minmax(72px,1.2fr) 64px 74px 44px;
      gap: 8px;
      align-items: center;
      border: 1px solid #252525;
    }
    .trade-num {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
    .trade-pnl {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .trade-pnl.profit { color: #4caf50; }
    .trade-pnl.loss { color: #f44336; }
    .trade-return {
      font-size: 0.85rem;
      text-align: center;
      white-space: nowrap;
    }
    .trade-return.profit { color: #4caf50; }
    .trade-return.loss { color: #f44336; }
    .trade-balance {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
      white-space: nowrap;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 10px;
      border-radius: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:active {
      color: #f44336;
      background: rgba(244,67,54,0.1);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #444;
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    .empty-state-text {
      font-size: 0.95rem;
    }
    /* 弹窗样式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 24px 20px;
      width: 90%;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      color: #e0e0e0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      color: #fff;
    }
    .modal-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #252525;
    }
    .modal-stat:last-child {
      border-bottom: none;
    }
    .modal-label {
      font-size: 0.9rem;
      color: #aaa;
    }
    .modal-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    .modal-value.positive { color: #4caf50; }
    .modal-value.negative { color: #f44336; }
    .modal-close {
      margin-top: 24px;
      background: #2a2a2a;
      border: none;
      color: #ccc;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-close:active {
      background: #3a3a3a;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #141414;
      border-top: 1px solid #252525;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      color: #666;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
      border: none;
      background: none;
    }
    .nav-item.active {
      color: #fff;
    }
    .nav-item .nav-icon {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }
    .nav-item .nav-label {
      font-size: 0.7rem;
      font-weight: 500;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }
    .top-nav {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      flex-shrink: 0;
    }
    .top-nav-btn {
      flex: 1;
      min-width: 0;
      padding: 12px 8px;
      border: 1px solid #333;
      background: none;
      color: #666;
      cursor: pointer;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .top-nav-btn.active {
      background: #333;
      color: #fff;
      border-color: #444;
    }
    .top-nav-btn:active {
      transform: scale(0.98);
    }
    @media (min-width: 768px) {
      .container { max-width: 520px; }
      .chart-container { min-height: 260px; }
    }
    /* 交易管理页：始终让内容铺满整屏（仅在存在多余空间时上下分散，矮屏不受影响） */
    #pageManage { justify-content: space-between; }
    /* 大屏手机（如 iPhone 16 Pro）：图表更高更舒展 */
    @media (min-height: 740px) {
      .chart-container { min-height: 200px; }
      .current-balance .value { font-size: 1.6rem; }
    }
    /* 常见小屏手机：紧凑排版，保证一屏放下（仅矮屏生效，不再全局覆盖舒适样式） */
    @media (max-height: 700px) {
      .top-nav { padding: 6px 0; }
      .top-nav-btn { padding: 9px 6px; font-size: 0.85rem; }
      .card { padding: 12px; }
      .card.compact { padding: 10px; }
      .card-title { margin-bottom: 8px; padding-bottom: 8px; font-size: 0.82rem; }
      .current-balance { padding: 10px; margin-bottom: 9px; }
      .current-balance .value { font-size: 1.3rem; }
      .form-group { margin-bottom: 9px; }
      .form-group label { margin-bottom: 5px; font-size: 0.75rem; }
      .form-group input { padding: 10px 12px; }
      .pnl-input-item input { padding: 10px 12px; }
      .pnl-input-item label { margin-bottom: 4px; }
      .btn { padding: 11px; min-height: 40px; }
      .btn.compact { padding: 9px; min-height: 36px; }
      .mode-btn { padding: 9px 8px; }
      .stat-card { padding: 8px 6px; }
      .stat-card.main { padding: 10px 8px; }
      .stat-value { font-size: 0.8rem; }
      .stat-card.main .stat-value { font-size: 0.95rem; }
      .chart-container { min-height: 110px; }
      .trade-item { padding: 11px 12px; }
    }
    @media (max-height: 680px) {
      .top-nav-btn { padding: 8px 6px; font-size: 0.78rem; }
      .card { padding: 10px; }
      .card.compact { padding: 9px; }
      .card-title { margin-bottom: 6px; padding-bottom: 6px; }
      .current-balance { padding: 8px; margin-bottom: 8px; }
      .current-balance .value { font-size: 1.15rem; }
      .current-balance .label { font-size: 0.72rem; margin-bottom: 2px; }
      .form-group { margin-bottom: 7px; }
      .form-group input, .pnl-input-item input { padding: 8px 10px; }
      .btn { padding: 9px; min-height: 36px; }
      .btn.compact { padding: 8px; min-height: 32px; }
      .stat-value { font-size: 0.75rem; }
      .stat-card.main .stat-value { font-size: 0.88rem; }
      .chart-container { min-height: 95px; }
    }
    /* 极小屏（矮+窄）允许页面内滚动，防止关键操作被裁 */
    @media (max-height: 600px) and (max-width: 380px) {
      .page.active { overflow-y: auto; overscroll-behavior: contain; }
    }
    @media (max-width: 400px) {
      .trade-header { grid-template-columns: 30px minmax(62px,1.1fr) 54px 62px 40px; gap: 6px; font-size: 0.7rem; padding: 8px 10px; }
      .trade-item { grid-template-columns: 30px minmax(62px,1.1fr) 54px 62px 40px; gap: 6px; padding: 12px 10px; }
      .trade-pnl { font-size: 0.9rem; }
      .trade-return { font-size: 0.8rem; }
      .trade-balance { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <button class="top-nav-btn active" id="topNavManage" onclick="switchPage('manage')">交易管理</button>
    <button class="top-nav-btn" id="topNavData" onclick="switchPage('data')">交易数据</button>

<script>
  (function() {
    var initial = 100000;
    var trades = [];
    var mode = 'pnl';
    var chartType = 'equity';
    var initialLocked = false;
    var chartPoints = [];
    var currentPage = 'manage';
    var pnlStart = 0;      // 单笔盈亏图当前展示的第一笔索引
    var pnlSelected = -1;  // 当前选中的交易索引（0 基）
    var pnlSlot = 44;      // 单根柱子占位宽度
    var pnlVisible = 1;    // 当前可视柱子数量
    var pnlCount = 6;      // 一屏显示的笔数（缩放级别）
    var lineSelectedIdx = 0; // 资产/收益率曲线当前选中的点索引
    var lineMarker = false;  // 资产/收益率：竖虚线仅在交互时显示

    function init() {
      load();
      updateInitialUI();
      render();
      bindChartEvents();
      bindPnlInputEvents();
      // 点击遮罩关闭弹窗
      document.getElementById('ratioModal').addEventListener('click', function(e) {
        if (e.target === this) closeRatioModal();
      });
      document.getElementById('countModal').addEventListener('click', function(e) {
        if (e.target === this) closeCountModal();
      });
      document.getElementById('drawdownModal').addEventListener('click', function(e) {
        if (e.target === this) closeDrawdownModal();
      });
      document.getElementById('netPnlModal').addEventListener('click', function(e) {
        if (e.target === this) closeNetPnlModal();
      });
      document.getElementById('importFile').addEventListener('change', function(e) {
        if (e.target.files && e.target.files.length > 0) handleImportFile(e.target.files[0]);
      });
    }

    function bindPnlInputEvents() {
      var profitInput = document.getElementById('inputProfit');
      var lossInput = document.getElementById('inputLoss');
      profitInput.addEventListener('input', function() { if (this.value !== '') lossInput.value = ''; });
      lossInput.addEventListener('input', function() { if (this.value !== '') profitInput.value = ''; });
    }

    window.switchPage = function(page) {
      currentPage = page;
      document.getElementById('pageManage').classList.toggle('active', page === 'manage');
      document.getElementById('pageData').classList.toggle('active', page === 'data');
      document.getElementById('pageTrades').classList.toggle('active', page === 'trades');
      document.getElementById('topNavManage').classList.toggle('active', page === 'manage');
      document.getElementById('topNavData').classList.toggle('active', page === 'data');
      document.getElementById('topNavTrades').classList.toggle('active', page === 'trades');
      if (page === 'data') setTimeout(drawChart, 50);
      window.scrollTo(0, 0);
    };

    function updateInitialUI() {
      var input = document.getElementById('initialCapital');
      var btn = document.getElementById('btnSetInitial');
      var hint = document.getElementById('initialHint');
      if (initialLocked) {
        input.disabled = true;
        btn.disabled = true;
        hint.textContent = '清空数据后可重新设置';
      } else {
        input.disabled = false;
        btn.disabled = false;
        hint.textContent = '';
      }
    }

    window.setMode = function(m) {
      mode = m;
      document.getElementById('btnPnl').className = m === 'pnl' ? 'mode-btn active' : 'mode-btn';
      document.getElementById('btnBal').className = m === 'balance' ? 'mode-btn active' : 'mode-btn';
      document.getElementById('groupPnl').style.display = m === 'pnl' ? 'block' : 'none';
      document.getElementById('groupBal').style.display = m === 'balance' ? 'block' : 'none';
    };

    window.showChart = function(type) {
      chartType = type;
      document.getElementById('tabEquity').className = type === 'equity' ? 'chart-tab active' : 'chart-tab';
      document.getElementById('tabReturn').className = type === 'return' ? 'chart-tab active' : 'chart-tab';
      document.getElementById('tabPnl').className = type === 'pnl' ? 'chart-tab active' : 'chart-tab';
      document.getElementById('tooltip').classList.remove('show');
      lineMarker = false; // 切换图表时竖虚线不显示
      if (type === 'pnl') {
        // 默认定位到最近一笔，并让最近一笔在可视窗口内
        pnlSelected = trades.length - 1;
        pnlStart = Math.max(0, trades.length - pnlCount);
      } else {
        var s = getStats();
        var data = type === 'equity' ? s.equity : s.returns;
        lineSelectedIdx = Math.max(0, data.length - 1);
      }
      drawChart();
    };



    window.setInitial = function() {
      if (initialLocked) return;
      var val = parseFloat(document.getElementById('initialCapital').value);
      if (isNaN(val) || val <= 0) { alert('请输入有效的初始资产'); return; }
      initial = val;
      initialLocked = true;
      updateInitialUI();
      save();
      render();
    };

    function getBalance() {
      var bal = initial;
      for (var i = 0; i < trades.length; i++) bal += trades[i].pnl;
      return bal;
    }

    window.addTrade = function() {
      if (!initialLocked) { alert('请先确认设置初始资产'); return; }
      var pnl, currentBal = getBalance();
      if (mode === 'pnl') {
        var profitVal = document.getElementById('inputProfit').value;
        var lossVal = document.getElementById('inputLoss').value;
        if (profitVal !== '' && !isNaN(parseFloat(profitVal))) pnl = Math.abs(parseFloat(profitVal));
        else if (lossVal !== '' && !isNaN(parseFloat(lossVal))) pnl = -Math.abs(parseFloat(lossVal));
        else { alert('请输入盈利金额或亏损金额'); return; }
      } else {
        var v = document.getElementById('inputBal').value;
        if (v === '' || isNaN(parseFloat(v))) { alert('请输入有效的账户余额'); return; }
        pnl = parseFloat(v) - currentBal;
      }
      trades.push({ id: Date.now(), pnl: pnl, before: currentBal });
      document.getElementById('inputProfit').value = '';
      document.getElementById('inputLoss').value = '';
      document.getElementById('inputBal').value = '';
      document.activeElement.blur();
      save();
      render();
      showToast('记录已添加');
    };

    function showToast(msg) {
      var toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#333;color:#fff;padding:12px 24px;border-radius:10px;z-index:9999;font-size:0.9rem;';
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.transition = 'opacity 0.3s'; toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 1500);
    }

    window.deleteTrade = function(id) {
      if (!confirm('确定删除此笔交易记录？')) return;
      var newTrades = [];
      for (var i = 0; i < trades.length; i++) if (trades[i].id !== id) newTrades.push(trades[i]);
      trades = newTrades;
      recalc();
      save();
      render();
    };

    function recalc() {
      var bal = initial;
      for (var i = 0; i < trades.length; i++) { trades[i].before = bal; bal += trades[i].pnl; }
    }

    function getStats() {
      var s = {
        capital: initial, totalPnl: 0, totalReturn: 0, maxDD: 0, winRate: 0,
        ratio: 0, count: trades.length, avg: 0, maxConsecLoss: 0,
        equity: [initial], returns: [0],
        avgWin: 0, avgLoss: 0, winCount: 0, lossCount: 0,
        totalWin: 0, totalLoss: 0
      };
      if (trades.length === 0) return s;
      var bal = initial, peak = initial;
      var wins = 0, losses = 0, winSum = 0, lossSum = 0;
      var consec = 0, maxConsec = 0;
      for (var i = 0; i < trades.length; i++) {
        var t = trades[i];
        bal += t.pnl;
        s.equity.push(bal);
        s.returns.push((bal - initial) / initial * 100);
        if (t.pnl > 0) { wins++; winSum += t.pnl; consec = 0; }
        else if (t.pnl < 0) { losses++; lossSum += Math.abs(t.pnl); consec++; if (consec > maxConsec) maxConsec = consec; }
        else { consec = 0; }
        if (bal > peak) peak = bal;
        var dd = peak > 0 ? (peak - bal) / peak : 0;
        if (dd > s.maxDD) s.maxDD = dd;
      }
      s.capital = bal;
      s.totalPnl = bal - initial;
      s.totalWin = winSum;
      s.totalLoss = lossSum;
      s.totalReturn = (s.totalPnl / initial) * 100;
      s.maxDD = s.maxDD * 100;
      s.winRate = trades.length > 0 ? (wins / trades.length) * 100 : 0;
      s.avg = trades.length > 0 ? s.totalPnl / trades.length : 0;
      s.maxConsecLoss = maxConsec;
      s.winCount = wins;
      s.lossCount = losses;
      s.avgWin = wins > 0 ? winSum / wins : 0;
      s.avgLoss = losses > 0 ? lossSum / losses : 0;
      s.ratio = s.avgLoss > 0 ? s.avgWin / s.avgLoss : (s.avgWin > 0 ? Infinity : 0);
      return s;
    }

    function fmt(v) {
      var prefix = v >= 0 ? '$' : '-$';
      return prefix + Math.abs(v).toLocaleString('en-US', {maximumFractionDigits: 0});
    }

    // 单笔盈亏使用两位小数
    function fmt2(v) {
      var prefix = v >= 0 ? '$' : '-$';
      return prefix + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function axisNum(v) {
      return v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function dateOf(t) {
      var d = new Date(t.id);
      if (isNaN(d.getTime())) return '-';
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function shortDate(t) {
      var s = dateOf(t);
      return s === '-' ? '' : s.slice(5);
    }

    // 圆角矩形路径（用于柱状图）
    function roundBar(ctx, x, y, w, h, r) {
      if (h < 2) h = 2;
      if (w < 2) w = 2;
      if (r > w / 2) r = w / 2;
      if (r > h / 2) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function render() {
      var s = getStats();
      document.getElementById('displayBalance').textContent = fmt(s.capital);
      document.getElementById('statCapital').textContent = fmt(s.capital);
      var retEl = document.getElementById('statReturn');
      retEl.textContent = s.totalReturn.toFixed(2) + '%';
      retEl.className = 'stat-value ' + (s.totalReturn >= 0 ? 'positive' : 'negative');
      var pnlEl = document.getElementById('statPnl');
      pnlEl.textContent = (s.totalPnl >= 0 ? '+' : '') + fmt(s.totalPnl);
      pnlEl.className = 'stat-value ' + (s.totalPnl >= 0 ? 'positive' : 'negative');
      var ddEl = document.getElementById('statDrawdown');
      ddEl.textContent = s.maxDD.toFixed(2) + '%';
      ddEl.className = 'stat-value' + (s.maxDD > 0 ? ' negative' : '');
      document.getElementById('statWinRate').textContent = s.winRate.toFixed(2) + '%';
      var ratioEl = document.getElementById('statRatio');
      ratioEl.textContent = s.ratio === Infinity ? '∞' : (s.ratio === 0 && trades.length === 0 ? '-' : s.ratio.toFixed(2));
      document.getElementById('statCount').textContent = s.count;
      var avgEl = document.getElementById('statAvg');
      avgEl.textContent = (s.avg >= 0 ? '+' : '') + fmt(s.avg);
      avgEl.className = 'stat-value ' + (s.avg >= 0 ? 'positive' : 'negative');
      document.getElementById('statMaxLoss').textContent = s.maxConsecLoss;
      if (currentPage === 'data') drawChart();
      renderTradeList();
    }

    function drawChart() {
      var canvas = document.getElementById('chartCanvas');
      var ctx = canvas.getContext('2d');
      var container = document.getElementById('chartBox');
      var dpr = window.devicePixelRatio || 1;
      var rect = container.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var s = getStats();
      var data = chartType === 'equity' ? s.equity : s.returns;
      var threshold = chartType === 'equity' ? initial : 0;
      var w = rect.width, h = rect.height;
      if (chartType === 'pnl') {
        drawPnlChart(ctx, w, h);
        return;
      }
      updateChartInfo();
      var pad = {t:20, r:15, b:14, l:60};
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      ctx.clearRect(0,0,w,h);
      chartPoints = [];
      if (data.length < 1) {
        ctx.fillStyle = '#444'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('暂无数据', w/2, h/2); return;
      }
      var minV = Math.min.apply(null, data), maxV = Math.max.apply(null, data);
      var range = maxV - minV || 1;
      var yMin = minV - range * 0.1, yMax = maxV + range * 0.1;
      ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 1;
      for (var i=0; i<=4; i++) {
        var y = pad.t + (ch/4)*i;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
        var val = yMax - ((yMax-yMin)/4)*i;
        ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(chartType==='equity'?fmt(val):val.toFixed(1)+'%', pad.l-8, y+4);
      }
      if (yMin < threshold && yMax > threshold) {
        var ty = pad.t + ch * ((yMax-threshold)/(yMax-yMin));
        ctx.strokeStyle = '#333'; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(pad.l, ty); ctx.lineTo(w-pad.r, ty); ctx.stroke();
        ctx.setLineDash([]);
      }
      var pts = [];
      for (var i=0; i<data.length; i++) {
        var x = pad.l + (cw/Math.max(data.length-1,1))*i;
        var y = pad.t + ch * ((yMax-data[i])/(yMax-yMin));
        pts.push({x:x, y:y, val:data[i], idx:i});
        chartPoints.push({x:x, y:y, val:data[i], idx:i});
      }
      if (lineSelectedIdx < 0 || lineSelectedIdx >= data.length) lineSelectedIdx = data.length - 1;

      // 折线图（每笔等间距直连）
      // 整体盈利为绿色，整体亏损为红色
      var lastVal = data[data.length - 1];
      var overallUp = chartType === 'equity' ? (lastVal >= initial) : (lastVal >= 0);
      var color = overallUp ? '#4caf50' : '#f44336';
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (var i=1; i<pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();

      // 当前选中点的竖虚线：仅在点击/滑动交互后出现
      if (lineMarker) {
        var sel = pts[lineSelectedIdx];
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sel.x, pad.t); ctx.lineTo(sel.x, pad.t+ch); ctx.stroke();
        ctx.setLineDash([]);
        // 空心圆点：底色填充 + 曲线同色描边
        ctx.fillStyle = '#141414';
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sel.x, sel.y, 4, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
      }
    }

    function clampStart(v) {
      var maxStart = Math.max(0, trades.length - pnlVisible);
      if (v < 0) return 0;
      if (v > maxStart) return maxStart;
      return v;
    }

    // 单笔盈亏缩放级别（一屏显示笔数）
    function clampCount(v) {
      var n = trades.length;
      if (n === 0) return 1;
      var maxC = Math.max(1, Math.min(n, 40));
      var minC = Math.max(1, Math.min(n, 2));
      if (v < minC) v = minC;
      if (v > maxC) v = maxC;
      return v;
    }

    function updateChartInfo() {
      var info = document.getElementById('chartInfo');
      var titleEl = info.querySelector('.ci-title');
      var valEl = document.getElementById('ciValue');

      if (chartType === 'pnl') {
        titleEl.textContent = '单笔盈亏';
        info.style.display = 'block';
        if (trades.length === 0) {
          valEl.textContent = '$0.00';
          valEl.className = 'ci-value';
          return;
        }
        if (pnlSelected < 0 || pnlSelected >= trades.length) pnlSelected = trades.length - 1;
        var t = trades[pnlSelected];
        valEl.textContent = (t.pnl > 0 ? '+' : '') + fmt2(t.pnl);
        var cls = t.pnl > 0 ? 'positive' : (t.pnl < 0 ? 'negative' : '');
        valEl.className = 'ci-value ' + cls;
        return;
      }

      // 资产 / 收益率模式
      info.style.display = 'block';
      var s = getStats();
      var data = chartType === 'equity' ? s.equity : s.returns;
      if (data.length === 0) {
        titleEl.textContent = chartType === 'equity' ? '资产余额' : '累计收益率';
        valEl.textContent = chartType === 'equity' ? '$0.00' : '0.00%';
        valEl.className = 'ci-value';
        return;
      }
      if (lineSelectedIdx < 0 || lineSelectedIdx >= data.length) lineSelectedIdx = data.length - 1;
      var val = data[lineSelectedIdx];
      titleEl.textContent = chartType === 'equity' ? '资产余额' : '累计收益率';
      if (chartType === 'equity') {
        valEl.textContent = fmt2(val);
        valEl.className = 'ci-value ' + (val >= initial ? 'profit' : 'loss');
      } else {
        valEl.textContent = (val >= 0 ? '+' : '') + val.toFixed(2) + '%';
        valEl.className = 'ci-value ' + (val >= 0 ? 'profit' : 'loss');
      }
    }

    function drawPnlChart(ctx, w, h) {
      var n = trades.length;
      chartPoints = [];
      if (n === 0) {
        pnlSelected = -1;
        ctx.fillStyle = '#444'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('暂无数据', w / 2, h / 2);
        updateChartInfo();
        return;
      }
      var pad = {t: 22, r: 14, b: 16, l: 64};
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      if (cw <= 0 || ch <= 0) { updateChartInfo(); return; }
      // 缩放：只改变柱子粗细（一屏显示的笔数），图表尺寸不变
      var maxCount = Math.max(1, Math.min(n, 40));
      var minCount = Math.max(1, Math.min(n, 2));
      if (pnlCount < minCount) pnlCount = minCount;
      if (pnlCount > maxCount) pnlCount = maxCount;
      pnlVisible = pnlCount;
      var slot = cw / pnlCount;
      pnlSlot = slot;
      var offsetX = pad.l;
      // 左右滑动可平移窗口查看更早/更晚的交易
      pnlStart = clampStart(pnlStart);
      var vis = trades.slice(pnlStart, pnlStart + pnlVisible);
      if (pnlSelected >= n) pnlSelected = n - 1;
      if (pnlSelected < 0) pnlSelected = n - 1;

      // 计算 Y 轴范围，确保 0 在范围内并留出 15% 边距
      var lo = 0, hi = 0;
      for (var i = 0; i < vis.length; i++) {
        if (vis[i].pnl < lo) lo = vis[i].pnl;
        if (vis[i].pnl > hi) hi = vis[i].pnl;
      }
      if (hi === lo) { hi = 1; lo = -1; }
      var span = hi - lo;
      hi += span * 0.15;
      lo -= span * 0.15;

      ctx.clearRect(0, 0, w, h);

      // 网格与 Y 轴标签
      ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 1;
      for (var i = 0; i <= 4; i++) {
        var gy = pad.t + (ch / 4) * i;
        ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(w - pad.r, gy); ctx.stroke();
        ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(axisNum(hi - ((hi - lo) / 4) * i), pad.l - 8, gy + 4);
      }

      // 0 基线
      var zeroY = pad.t + ch * ((hi - 0) / (hi - lo));
      ctx.strokeStyle = '#3a3a3a'; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(w - pad.r, zeroY); ctx.stroke();
      ctx.setLineDash([]);

      // 柱子
      var barW = Math.max(2, Math.min(slot * 0.58, 26));
      for (var k = 0; k < vis.length; k++) {
        var t = vis[k];
        var gIdx = pnlStart + k;
        var cx = offsetX + slot * k + slot / 2;
        var yTop = pad.t + ch * ((hi - t.pnl) / (hi - lo));
        var color = t.pnl > 0 ? '#4caf50' : (t.pnl < 0 ? '#f44336' : '#666');
        var isSel = gIdx === pnlSelected;
        var inView = pnlSelected >= pnlStart && pnlSelected < pnlStart + pnlVisible;
        ctx.globalAlpha = isSel ? 1 : (inView ? 0.75 : 1);
        ctx.fillStyle = color;
        var by = Math.min(yTop, zeroY);
        var bh = Math.max(Math.abs(zeroY - yTop), 2);
        roundBar(ctx, cx - barW / 2, by, barW, bh, 3);
        ctx.fill();
        if (isSel) {
          ctx.strokeStyle = 'rgba(255,255,255,0.55)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        chartPoints.push({
          x: cx, x0: cx - Math.max(barW / 2 + 3, 6), x1: cx + Math.max(barW / 2 + 3, 6),
          yTop: by, yBase: by + bh,
          val: t.pnl, idx: gIdx
        });
      }
      updateChartInfo();
    }

    function bindChartEvents() {
      var canvas = document.getElementById('chartCanvas');
      var tooltip = document.getElementById('tooltip');
      var dragging = false, dragMoved = false, dragStartX = 0, dragStartY = 0, dragStartPnl = 0;
      var pinching = false, pinchUsed = false, pinchStartDist = 0, pinchStartCount = 0;

      // 双指距离
      function touchDist(e) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function barAt(mx) {
        for (var i=0; i<chartPoints.length; i++) {
          var p = chartPoints[i];
          if (mx >= p.x0 && mx <= p.x1) return p;
        }
        return null;
      }

      // 单笔盈亏：点击柱子（不再弹悬浮窗，仅更新上方信息区）
      function selectBar(clientX) {
        var rect = canvas.getBoundingClientRect();
        var hit = barAt(clientX - rect.left);
        tooltip.classList.remove('show');
        if (!hit) return;
        pnlSelected = hit.idx;
        drawChart();
      }

      // 资产/收益率：根据 x 坐标选中最近节点
      function pickLineIndex(clientX) {
        if (chartType !== 'equity' && chartType !== 'return') return;
        var rect = canvas.getBoundingClientRect();
        var mx = clientX - rect.left;
        var s = getStats();
        var data = chartType === 'equity' ? s.equity : s.returns;
        var n = data.length;
        if (n === 0) return;
        var pad = {t:20, r:15, b:30, l:60};
        var cw = rect.width - pad.l - pad.r;
        var idx = Math.round((mx - pad.l) / cw * (n - 1));
        if (idx < 0) idx = 0;
        if (idx >= n) idx = n - 1;
        var needDraw = (idx !== lineSelectedIdx) || !lineMarker;
        lineMarker = true;
        lineSelectedIdx = idx;
        if (needDraw) drawChart();
        updateChartInfo();
      }

      function resetLineToLatest() {
        if (chartType !== 'equity' && chartType !== 'return') return;
        var s = getStats();
        var data = chartType === 'equity' ? s.equity : s.returns;
        lineSelectedIdx = Math.max(0, data.length - 1);
        lineMarker = false; // 移出图表后隐藏竖虚线
        drawChart();
        updateChartInfo();
      }

      function startDrag(clientX, clientY) {
        if (chartType !== 'pnl') return;
        dragging = true; dragMoved = false;
        dragStartX = clientX; dragStartY = clientY; dragStartPnl = pnlStart;
      }

      function moveDrag(clientX, clientY) {
        if (!dragging || chartType !== 'pnl') return;
        var dx = clientX - dragStartX, dy = clientY - dragStartY;
        if (!dragMoved) {
          if (Math.abs(dx) < 8 || Math.abs(dx) <= Math.abs(dy)) return;
          dragMoved = true;
          tooltip.classList.remove('show');
        }
        // 左右滑动图表：平移查看窗口
        var target = clampStart(dragStartPnl + Math.round(-dx / Math.max(pnlSlot, 1)));
        if (target !== pnlStart) {
          pnlStart = target;
          if (pnlSelected < pnlStart || pnlSelected >= pnlStart + pnlVisible) {
            pnlSelected = Math.min(pnlStart + pnlVisible - 1, trades.length - 1);
          }
          drawChart();
        }
      }

      // 鼠标
      canvas.addEventListener('mousedown', function(e) {
        if (chartType === 'pnl') { startDrag(e.clientX, e.clientY); return; }
        pickLineIndex(e.clientX);
      });
      canvas.addEventListener('mousemove', function(e) {
        if (chartType === 'pnl') { moveDrag(e.clientX, e.clientY); return; }
        pickLineIndex(e.clientX);
      });
      window.addEventListener('mouseup', function(e) {
        if (!dragging) return;
        dragging = false;
        if (!dragMoved && chartType === 'pnl') selectBar(e.clientX, e.clientY);
      });
      canvas.addEventListener('mouseleave', function() {
        if (chartType === 'pnl') {
          if (!dragging) tooltip.classList.remove('show');
          return;
        }
        resetLineToLatest();
      });

      // 触摸：单指滑动平移，双指捏合缩放（仅单笔盈亏）
      canvas.addEventListener('touchstart', function(e) {
        if (chartType === 'pnl' && e.touches.length >= 2) {
          dragging = false; dragMoved = true;
          pinching = true; pinchUsed = true;
          pinchStartDist = touchDist(e);
          pinchStartCount = pnlCount;
          tooltip.classList.remove('show');
          return;
        }
        if (e.touches.length !== 1) return;
        if (chartType === 'pnl') startDrag(e.touches[0].clientX, e.touches[0].clientY);
        else pickLineIndex(e.touches[0].clientX);
      }, {passive:true});
      canvas.addEventListener('touchmove', function(e) {
        if (chartType === 'pnl' && e.touches.length >= 2 && pinching) {
          var d = touchDist(e);
          if (pinchStartDist > 0 && d > 0) {
            // 手指张开 -> 距离变大 -> 显示更少笔（柱子更粗）
            var target = clampCount(Math.round(pinchStartCount * (pinchStartDist / d)));
            if (target !== pnlCount) { pnlCount = target; drawChart(); }
          }
          return;
        }
        if (e.touches.length !== 1) return;
        if (chartType === 'pnl') moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        else pickLineIndex(e.touches[0].clientX);
      }, {passive:true});
      canvas.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) pinching = false;
        if (pinchUsed) {
          if (e.touches.length === 0) pinchUsed = false;
          return;
        }
        if (chartType === 'pnl') {
          var t = e.changedTouches[0];
          var wasDrag = dragMoved;
          dragging = false;
          if (!wasDrag && t) selectBar(t.clientX);
        }
      });
    }

    function renderTradeList() {

    // 计算历次回撤：从每个高点回落开始，到重新回到该高点结束
    function getDrawdowns() {
      var equity = [initial], bal = initial;
      for (var i = 0; i < trades.length; i++) { bal += trades[i].pnl; equity.push(bal); }
      var eps = [];
      var peak = equity[0], cur = null;
      for (var i = 1; i < equity.length; i++) {
        if (equity[i] > peak) {
          // 创新高，回撤结束（已恢复）
          if (cur) { cur.recovered = true; eps.push(cur); cur = null; }
          peak = equity[i];
        } else if (equity[i] < peak) {
          var dd = peak > 0 ? (peak - equity[i]) / peak : 0;
          if (!cur) cur = { depth: dd, bars: 1, recovered: false };
          else { cur.bars++; if (dd > cur.depth) cur.depth = dd; }
        } else if (cur) {
          // 回到前高
          cur.recovered = true; eps.push(cur); cur = null;
        }
      }
      if (cur) eps.push(cur); // 最后一段仍在回撤中（未恢复）
      return eps;
    }

    // 打开回撤弹窗：第一行最大回撤，其后为历次回撤
    window.openDrawdownModal = function() {
      var s = getStats();

      var html = '';
      html += '<div class="modal-stat"><span class="modal-label">最大回撤</span>' +
              '<span class="modal-value negative">' + s.maxDD.toFixed(2) + '%</span></div>';
      if (eps.length === 0) {
        html += '<div class="modal-stat"><span class="modal-label">历次回撤</span>' +
                '<span class="modal-value">暂无</span></div>';
      } else {
        for (var i = 0; i < eps.length; i++) {
          var e = eps[i];
          var label = '第 ' + (i + 1) + ' 次回撤 · ' + e.bars + ' 笔' + (e.recovered ? '' : '（未恢复）');
          html += '<div class="modal-stat"><span class="modal-label">' + label + '</span>' +
                  '<span class="modal-value negative">-' + (e.depth * 100).toFixed(2) + '%</span></div>';
        }
      }
      document.getElementById('drawdownList').innerHTML = html;
      document.getElementById('drawdownModal').classList.add('active');
    };

    var DB_NAME = 'tradePhoneDB', STORE = 'kv', LS_KEY = 'tradeData';

    function safeParse(s) {
      try { return JSON.parse(s); } catch (e) { return null; }
    }
    function idbOpen() {
      return new Promise(function (res, rej) {
        if (!window.indexedDB) { rej('no-idb'); return; }
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { rej(req.error); };
      });
    }
    function idbGet(db, key) {
      return new Promise(function (res) {
        try {
          var tx = db.transaction(STORE, 'readonly');
          var r = tx.objectStore(STORE).get(key);
          r.onsuccess = function () { res(r.result || null); };
          r.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    }
    function idbPut(db, key, val) {
      return new Promise(function (res) {
        try {
          var tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(val, key);
          tx.oncomplete = function () { res(true); };
          tx.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    }

    // 同时持久化到 IndexedDB（主，主屏 App 重启后可可靠恢复）与 localStorage（兜底）
    function save() {
      var obj = { initial: initial, trades: trades, locked: initialLocked };
      try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch (e) {}
      idbOpen()
        .then(function (db) { return idbPut(db, 'data', JSON.stringify(obj)); })
        .catch(function () {});
    }

    function applyData(obj) {
      if (obj) {
        initial = obj.initial || 100000;
        trades = obj.trades || [];
        initialLocked = obj.locked || false;
        var inp = document.getElementById('initialCapital');
        if (inp) inp.value = initial;
        recalc();
      }
    }

    function load() {
      var done = function (obj) {
        applyData(obj);
        updateInitialUI();
        render();
      };
      var lsRaw = null;
      try { lsRaw = localStorage.getItem(LS_KEY); } catch (e) {}
      var lsObj = safeParse(lsRaw);
      if (!window.indexedDB) { done(lsObj); return; }
      idbOpen()
        .then(function (db) { return idbGet(db, 'data'); })
        .then(function (idbRaw) { done(safeParse(idbRaw) || lsObj); })
        .catch(function () { done(lsObj); });
    }

    window.importCSV = function() {
      if (!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      var fileInput = document.getElementById('importFile');
      fileInput.value = '';
      fileInput.click();
    };

    function handleImportFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var text = (e.target.result || '').replace(/^﻿/, '');
          text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          var lines = text.split('\n');
          var parsedInitial = null;
          var headerIdx = -1;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (parsedInitial === null && line.indexOf('初始资产') === 0) {
              var ip = line.split(',');
              if (ip.length >= 2) {
                var iv = parseFloat(ip[1]);
                if (!isNaN(iv)) parsedInitial = iv;
              }
            }
            if (headerIdx === -1 && line.indexOf('序号') === 0) {
              headerIdx = i;
            }
          }
          if (headerIdx === -1) { alert('文件格式不正确：未找到交易记录表头'); return; }
          var newTrades = [];
          for (var j = headerIdx + 1; j < lines.length; j++) {
            var row = lines[j].trim();
            if (row === '') continue;
            var cols = row.split(',');
            if (cols.length < 2) continue;
            var idx = parseInt(cols[0], 10);
            if (isNaN(idx)) continue;
            var pnl = parseFloat(cols[1]);
            if (isNaN(pnl)) continue;
            var note = cols.length >= 5 ? cols[4].trim() : '';
            newTrades.push({ id: Date.now() + j, pnl: pnl, note: note, before: 0 });
          }
          if (newTrades.length === 0) { alert('文件中没有有效的交易记录'); return; }
          if (parsedInitial !== null && parsedInitial > 0) initial = parsedInitial;
          initialLocked = true;
          trades = newTrades;
          recalc();
          updateInitialUI();
          save();
          render();
          showToast('成功导入 ' + trades.length + ' 条记录');
        } catch (err) {
          alert('导入失败：' + (err && err.message ? err.message : err));
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    window.exportCSV = function() {
      var s = getStats();
      var csv = '交易记录分析报告\n\n初始资产,'+initial+'\n当前资产,'+s.capital+'\n总收益率,'+s.totalReturn.toFixed(2)+'%\n';
      csv += '总盈亏,'+s.totalPnl+'\n最大回撤,'+s.maxDD.toFixed(2)+'%\n胜率,'+s.winRate.toFixed(2)+'%\n';
      csv += '盈亏比,'+(s.ratio===Infinity?'无穷大':s.ratio.toFixed(2))+'\n交易次数,'+s.count+'\n最大连续亏损,'+s.maxConsecLoss+'\n\n';
      csv += '序号,盈亏,本次收益率,余额,备注\n';
      var bal = initial;
      for (var i=0; i<trades.length; i++) {
        var t = trades[i];
        var before = t.before !== undefined ? t.before : bal;
        bal = before + t.pnl;
        var ret = before > 0 ? (t.pnl/before*100).toFixed(2) : '0.00';
        csv += (i+1)+','+t.pnl+','+ret+'%,'+bal+','+(t.note||'')+'\n';
      }
      var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = '交易记录.csv';
      link.click();
      showToast('导出成功');
    };

    window.clearAll = function() {
      if (confirm('确定清空所有数据？此操作不可恢复。')) {
        trades = [];
        initialLocked = false;
        updateInitialUI();
        save();
        render();
        showToast('数据已清空');
      }
    };

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { if (currentPage === 'data') drawChart(); }, 100);
    });
    window.addEventListener('orientationchange', function() {
      setTimeout(function() { if (currentPage === 'data') drawChart(); }, 300);
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var id = document.activeElement.id;
        if (id === 'inputProfit' || id === 'inputLoss' || id === 'inputBal') addTrade();
      }
    });

    init();
  })();
</script>
</body>
</html>
